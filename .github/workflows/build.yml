name: Build Quest-Cord for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Quest-Cord main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quest-Cord-Windows
          path: dist/Quest-Cord.exe
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Quest-Cord.exe
          generate_release_notes: true
